[general]
# use `local.toml` to change default settings, e.g. font size
import = ["defaults.toml", "local.toml", "current_theme.toml"]

[window]
startup_mode = "Maximized"
decorations = "none"
dynamic_title = false

[[keyboard.bindings]]
key = "F11"
action = "ToggleFullScreen"

[bell]
command = { program = "paplay", args = [
    "/usr/share/sounds/freedesktop/stereo/bell.oga",
] }

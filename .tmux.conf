# bind -n C-j run "(tmux display-message -p '#{pane_current_command}' | grep -iqE '(^|\/)vim$' && tmux send-keys C-j) || tmux select-pane -D"
# bind -n C-k run "(tmux display-message -p '#{pane_current_command}' | grep -iqE '(^|\/)vim$' && tmux send-keys C-k) || tmux select-pane -U"
# bind -n C-l run "(tmux display-message -p '#{pane_current_command}' | grep -iqE '(^|\/)vim$' && tmux send-keys C-l) || tmux select-pane -R"
# bind -n C-\ run "(tmux display-message -p '#{pane_current_command}' | grep -iqE '(^|\/)vim$' && tmux send-keys 'C-\\') || tmux select-pane -l"


set -g status-interval 1  # refresh status line each second

# Copy mode
bind -T copy-mode-vi Escape send-keys -X cancel
bind -T copy-mode-vi Enter send-keys -X copy-pipe-and-cancel xclip
bind -T copy-mode-vi v send-keys -X begin-selection
bind -T copy-mode-vi C-v send-keys -X rectangle-toggle
bind -T copy-mode-vi y send-keys -X copy-pipe-and-cancel xclip

# Simple panes swith
bind h select-pane -L
bind j select-pane -D
bind k select-pane -U
bind l select-pane -R

# Reload config file
bind r source-file ~/.tmux.conf \; display-message 'Configuration reloaded!'

set -g default-terminal 'tmux-256color'
set -ga terminal-overrides ",*-256color:Tc"
set -g theme terminal

# Allows for faster key repetition
set -s escape-time 0

# increase scrollback lines
set -g history-limit 10000

# so vim can notice when a file changes from outside
set -g focus-events on

# Dim colored output along with default text in inactive panes
set -g window-style 'fg=terminal,bg=terminal,dim=40%'
set -g window-active-style 'fg=terminal,bg=terminal,dim=0%'


# status bar
# set -g status-justify centre

# # Center messages and preserve the surrounding status bar
set -ag message-style 'width=100%,align=centre,fill=default'

setw -g window-status-current-format ' #I #{?window_bell_flag,🔔,}#W '
setw -g window-status-format ' #I #{?window_bell_flag,🔔,}#W '
set-window-option -g window-status-separator ''

set -g status-bg black
setw -g window-status-current-style bg=brightblue,fg=brightwhite
setw -g window-status-style fg=white

set -g status-left  '#[bg=white]#[fg=black]'

set -g status-right '\
#[bg=white]\
#[fg=red]\
#[bold]\
#(git -C #{q:pane_current_path} diff --quiet HEAD || echo " +")\
#(git -C #{q:pane_current_path} status -sb | grep -q "ahead" && echo " ⇡")\
#[fg=black]\
#[nobold] #(git -C #{q:pane_current_path} rev-parse --abbrev-ref HEAD) \
'

#[nobold] #(git -C #{q:pane_current_path} rev-parse --abbrev-ref HEAD | cut -c 1-30) \
#[bg=black]\
#[fg=white] %H:%M '



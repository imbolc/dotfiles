# allow renaimng tabs with `printf '\e]2;My Custom Window Name\a'`
set-option -g allow-rename off


# remap prefix from 'C-b' to 'C-a'
unbind C-b
set -g prefix C-a

bind C-a last-window
bind C-c new-window
bind K confirm kill-window

# Is there's only 2 sessions <prefix><ctrl+s> switches between them whitout manual selection
bind s if -F '#{==:#{server_sessions},2}' 'switch-client -n; display-message -C -d 1500 " #{client_session} "' 'choose-tree -Zs'

# disable mouse mode
set -g mouse off

# hide status bar while in Vim
# set-hook -g pane-focus-in "if -F '#{m:*nvim*,#{pane_current_command}}' 'set status off' 'set status on'"

# set -g extended-keys on
# set -g extended-keys-format csi-u

# act like vim
set -g status-keys vi
setw -g mode-keys vi

# bell settings to allow Codex notifications
set -g visual-bell off
setw -g monitor-bell on

# Notify for bells from windows nobody is viewing, including detached sessions
set -g bell-action any
set-hook -g alert-bell {
    run-shell -b 'paplay /usr/share/sounds/freedesktop/stereo/bell.oga'
    if-shell -F '#{==:#{window_active_clients},0}' {
        run-shell -b 'notify-send -a tmux -i utilities-terminal -- #{q:hook_session_name}:#{hook_window_index} #{q:hook_window_name}'
    }
}

